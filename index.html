<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt Chart Dashboard</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="background"></div>

<header>

<div class="logo">

<i class="fa-solid fa-chart-gantt"></i>

<div>
<h1>GANTT CHART</h1>
<p>Project Timeline Dashboard</p>
</div>

</div>

<div class="actions">

<button id="todayBtn">
<i class="fa-solid fa-calendar-day"></i>
Today
</button>

<button id="addTask">
<i class="fa-solid fa-plus"></i>
Add Task
</button>

</div>

</header>

<section class="cards">

<div class="card">

<i class="fa-solid fa-calendar"></i>

<h3>Project Start</h3>

<p>03 Aug 2026</p>

</div>

<div class="card">

<i class="fa-solid fa-flag-checkered"></i>

<h3>Project End</h3>

<p>22 Aug 2026</p>

</div>

<div class="card">

<i class="fa-solid fa-chart-line"></i>

<h3>Progress</h3>

<div class="progress">

<div class="progress-bar"></div>

</div>

<span>48%</span>

</div>

<div class="card">

<i class="fa-solid fa-list-check"></i>

<h3>Total Tasks</h3>

<p id="taskCount">5</p>

</div>

</section>

<section class="gantt-container">

<table>

<thead>

<tr>

<th>Milestones</th>

<th>03 Aug</th>

<th>08 Aug</th>

<th>10 Aug</th>

<th>15 Aug</th>

<th>17 Aug</th>

<th>22 Aug</th>

</tr>

</thead>

<tbody id="ganttBody">

<tr>

<td>Introduction</td>

<td colspan="2">
<div class="task green">
70%
</div>
</td>

<td></td>

<td></td>

<td></td>

<td></td>

</tr>

<tr>

<td>Literature Review</td>

<td></td>

<td colspan="3">
<div class="task blue">
40%
</div>
</td>

<td></td>

<td></td>

</tr>

<tr>

<td>Methodology</td>

<td></td>

<td></td>

<td colspan="3">
<div class="task purple">
40%
</div>
</td>

<td></td>

</tr>

<tr>

<td>Prototype</td>

<td></td>

<td></td>

<td></td>

<td colspan="3">
<div class="task orange">
20%
</div>
</td>

</tr>

<tr>

<td>Testing</td>

<td></td>

<td></td>

<td></td>

<td></td>

<td colspan="2">
<div class="task red">
0%
</div>
</td>

</tr>

</tbody>

</table>

</section>

<footer>

<p>Developed with HTML • CSS • JavaScript</p>

</footer>

<script src="script.js"></script>

</body>

</html>
